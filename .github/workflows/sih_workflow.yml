name: SIH CI — NLAMS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check app/ app/seed.py tests/

      - name: Ruff format check
        run: ruff format --check app/ app/seed.py tests/

      - name: MyPy
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: nlams_test
          POSTGRES_USER: nlams_test
          POSTGRES_PASSWORD: nlams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nlams_test -d nlams_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://nlams_test:nlams_test@localhost:5432/nlams_test
      SYNC_DATABASE_URL: postgresql://nlams_test:nlams_test@localhost:5432/nlams_test
      SECRET_KEY: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --no-header
        continue-on-error: true

  backend-build:
    name: Backend — Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nlams-backend ./backend

  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings=50

  frontend-test:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run
        continue-on-error: true

  frontend-build:
    name: Frontend — Docker Build & Vite Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vite production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  docker-compose-smoke:
    name: Docker Compose — Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > backend/.env <<EOF
          DATABASE_URL=postgresql+asyncpg://nlams:nlams_secret@localhost:5432/nlams_db
          SYNC_DATABASE_URL=postgresql://nlams:nlams_secret@localhost:5432/nlams_db
          SECRET_KEY=sih-demo-secret-key
          UPLOAD_DIR=/app/uploads
          CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]
          EOF

      - name: Docker Compose up (postgres + backend)
        run: |
          docker compose up -d postgres backend
          sleep 30
          docker compose ps
          docker compose logs backend --tail=50
          docker compose down
